[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "sound-event-detection-claim-audit"
version = "0.1.0"
description = "Offline static documentation audit"
readme = "README.md"
requires-python = ">=3.9"
license = "MIT"

[project.scripts]
sound-event-detection-claim-audit = "sound_event_detection_claim_audit.audit:main"

[tool.setuptools.packages.find]
include = ["sound_event_detection_claim_audit*", "tests"]
